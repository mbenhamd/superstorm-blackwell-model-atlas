name: Bun quality and PostgreSQL integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: bench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bench -d bench_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bench:test-only-password@127.0.0.1:5432/bench_test
      TEST_DATABASE_URL: postgresql://bench:test-only-password@127.0.0.1:5432/bench_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run quality
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bun run test:postgres
      - run: bun run design:lint
